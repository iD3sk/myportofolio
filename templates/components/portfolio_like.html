{% if user.is_authenticated %}
  <form method="post" action="{{ toggle_url }}" class="inline">
    {% csrf_token %}
    <button
      type="submit"
      class="inline-flex items-center gap-[0.4rem] rounded-xl px-4 py-2 text-sm font-semibold text-paper transition-colors {% if user in likeable.liked_by.all %}bg-accent hover:bg-accent-dark{% else %}bg-ink hover:bg-primary{% endif %}"
      title="{% if user in likeable.liked_by.all %}Unlike this item{% else %}Like this item{% endif %}"
    >
      <span aria-hidden="true">&hearts;</span>
      {% if user in likeable.liked_by.all %}Unlike{% else %}Like{% endif %}
      <span class="rounded-full bg-white/25 px-[0.4rem] py-[0.05rem] text-[0.8rem]">{{ likeable.liked_by.count }}</span>
    </button>
  </form>
{% else %}
  <span class="inline-flex items-center gap-[0.4rem] rounded-xl border border-ink/20 px-4 py-2 text-sm font-semibold text-muted" title="Login to like this item">
    <span aria-hidden="true">&hearts;</span>
    {{ likeable.liked_by.count }} like{{ likeable.liked_by.count|pluralize }}
  </span>
{% endif %}

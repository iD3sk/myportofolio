{% if can_edit %}
  <a href="{{ edit_url }}" class="button button-secondary button-small flex-1">
    {{ edit_label }}
  </a>
{% endif %}
{% if can_delete %}
  <form method="post" action="{{ delete_url }}" class="flex-1">
    {% csrf_token %}
    <button type="submit" class="button button-small w-full">
      {{ delete_label }}
    </button>
  </form>
{% endif %}

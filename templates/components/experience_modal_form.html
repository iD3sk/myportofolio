<div id="add-experience-modal"
  class="hidden rounded-xl inset-0 z-10 m-0 h-full max-h-none w-full max-w-none items-start justify-center border-0 bg-transparent p-4 pt-20 [&:popover-open]:flex"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="add-experience-modal-title">
  <button type="button"
      class="absolute inset-0 h-full w-full cursor-default border-0 bg-[rgba(28,25,23,0.58)] p-0"
      popovertarget="add-experience-modal"
      popovertargetaction="hide"
      aria-label="Close add new experience form"></button>

  <div class="relative z-1 max-h-[calc(100vh-8rem)] w-[min(100%,640px)] overflow-y-auto rounded-xl border border-line bg-paper p-6 shadow-[0_1rem_3rem_rgba(28,25,23,0.22)] max-[600px]:max-h-[calc(100vh-8rem)] max-[600px]:w-full max-[600px]:p-5">
    <button type="button"
        class="absolute top-4 right-4 cursor-pointer bg-transparent p-0 text-muted text-[1.8rem] leading-none"
        popovertarget="add-experience-modal"
        popovertargetaction="hide"
        aria-label="Close add new experience form">×</button>

    <h2 id="add-experience-modal-title" class="mt-0 mr-10 mb-5 ml-0 font-display text-2xl">Add new experience</h2>
    <form id="experience-form"
       method="post"
       action="{% url 'main:create_experience' %}"
       class="experience-form">
      {% csrf_token %}
      <div class="flex flex-col gap-6">
        {% for field in form %}
          <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <p class="form-error">{{ error }}</p>
            {% endfor %}
          </div>
        {% endfor %}
      </div>
      <div class="mt-6 flex justify-end gap-3 max-[600px]:flex-col-reverse [&_button]:max-[600px]:w-full [&_button]:max-[600px]:text-center">
        <button type="button"
            class="button button-secondary"
            popovertarget="add-experience-modal"
            popovertargetaction="hide">Cancel</button>
        <button type="submit" class="button">Add Experience</button>
      </div>
    </form>
  </div>
</div>
